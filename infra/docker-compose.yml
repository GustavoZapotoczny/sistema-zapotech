# Serviços para desenvolvimento local.
# Subir:   docker compose -f infra/docker-compose.yml up -d
# Parar:   docker compose -f infra/docker-compose.yml down
# Zerar:   docker compose -f infra/docker-compose.yml down -v   (apaga os dados!)
name: zapotech

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zapotech
      POSTGRES_USER: zapotech
      POSTGRES_PASSWORD: zapotech  # só para desenvolvimento local
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapotech -d zapotech"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
  dados-redis:
